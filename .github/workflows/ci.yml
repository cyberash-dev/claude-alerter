name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux audio + focus dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y alsa-utils x11-utils xdotool

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: doctor smoke test
        run: node dist/src/cli.js doctor

      - name: install dry-run smoke test
        run: node dist/src/cli.js install --dry-run
